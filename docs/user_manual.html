<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podręcznik użytkownika - Calisto Vault</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📖 Podręcznik użytkownika</h1>
            <p>Calisto Vault - Bezpieczny Menedżer Haseł</p>
        </div>
    </header>

    <nav>
        <a href="index.html">Powrót do dokumentacji</a>
        <a href="developer_docs.html">Dokumentacja deweloperska</a>
        <a href="https://github.com/ElinaXproject/CalistoVault" target="_blank">Repository</a>
    </nav>

    <main>
        <div class="container">
            <div class="content markdown-body">
                <article id="user-manual-content">
                    <!-- Content will be injected by JavaScript -->
                    <p>Ładowanie treści...</p>
                </article>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2024 Calisto Vault | Autor: CALISTO</p>
        </div>
    </footer>

    <script>
        async function loadMarkdownContent() {
            try {
                const response = await fetch('user_manual.md');
                if (!response.ok) throw new Error('Nie można załadować pliku');
                const markdown = await response.text();
                document.getElementById('user-manual-content').innerHTML = 
                    `<pre>${escapeHtml(markdown)}</pre>`;
            } catch (error) {
                document.getElementById('user-manual-content').innerHTML = 
                    `<p style="color: var(--accent-gold);">Treść podręcznika będzie wyświetlana po wgraniu pliku user_manual.md</p>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener('DOMContentLoaded', loadMarkdownContent);
    </script>
</body>
</html>
