name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy documentation files
        run: |
          mkdir -p _site
          # Copy all HTML, CSS, JS files
          cp -r docs/*.html _site/ 2>/dev/null || true
          cp -r docs/*.css _site/ 2>/dev/null || true
          cp -r docs/*.js _site/ 2>/dev/null || true
          
          # Copy markdown files (for direct access)
          cp -r docs/*.md _site/ 2>/dev/null || true
          
          # Copy index.html as 404.html for custom 404 page
          cp docs/index.html _site/404.html 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
